name: Build and release APK

on:
  push:
    branches:
      - 'main'
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v3.0.1). Leave blank to auto-number from versionName + run number.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Resolve release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
          else
            # Every ordinary branch push (and any manual run with no tag
            # given) gets its own permanent, numbered release instead of
            # overwriting a shared "latest" one -- versionName from
            # build.gradle.kts plus this run's number, e.g. v3.0.12. That
            # number always increases, matching the versionCode passed to
            # the build below, so GitHub's own "Latest" badge and
            # /releases/latest link keep pointing at the newest release
            # without any custom rolling-tag bookkeeping.
            versionName=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            tag="v${versionName}.${RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=ScoreBox $tag" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ScoreBox-${{ steps.tag.outputs.tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: out/ScoreBox-${{ steps.tag.outputs.tag }}.apk
          body: |
            Signed build of ScoreBox for sideloading (Settings → allow installs from unknown sources, then open the APK). Every build shares the same signing key, so installing this over an existing ScoreBox install updates it in place -- no need to uninstall first.

            Built automatically from `${{ github.sha }}` on `${{ github.ref_name }}` (versionCode ${{ github.run_number }}).
